name: UI automation tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci
  BROWSER: chrome

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SeleniumPortfolio.Tests/SeleniumPortfolio.Tests.csproj

      - name: Smoke tests
        run: >
          dotnet test SeleniumPortfolio.Tests/SeleniumPortfolio.Tests.csproj
          --configuration Release
          --no-restore
          --filter "Category=Smoke"
          --logger "trx;LogFileName=smoke.trx"
          --logger "console;verbosity=normal"

      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            SeleniumPortfolio.Tests/**/TestResults/*.trx
            SeleniumPortfolio.Tests/**/Artifacts/Screenshots/*.png
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-smoke
          path: SeleniumPortfolio.Tests/bin/Release/net8.0/allure-results
          if-no-files-found: ignore

  regression:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SeleniumPortfolio.Tests/SeleniumPortfolio.Tests.csproj

      - name: Full regression
        run: >
          dotnet test SeleniumPortfolio.Tests/SeleniumPortfolio.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=regression.trx"
          --logger "console;verbosity=normal"

      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: |
            SeleniumPortfolio.Tests/**/TestResults/*.trx
            SeleniumPortfolio.Tests/**/Artifacts/Screenshots/*.png
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-regression
          path: SeleniumPortfolio.Tests/bin/Release/net8.0/allure-results
          if-no-files-found: ignore

  report:
    # The regression run includes the smoke tests, so use it when available; fall back to smoke if regression was skipped.
    needs: [smoke, regression]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-*
          path: allure-input

      - name: Pick results and generate report
        run: |
          if [ -d allure-input/allure-regression ]; then src=allure-input/allure-regression; else src=allure-input/allure-smoke; fi
          npx --yes allure-commandline generate "$src" --clean -o allure-report

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload report
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
